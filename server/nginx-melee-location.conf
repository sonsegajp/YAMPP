    # Melee PC netplay: hands the connection over to the netplay server on
    # localhost, so the lobby and the match relay share a port that is already
    # open rather than needing one of their own.
    location /melee/ {
        proxy_pass http://127.0.0.1:7420;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
        proxy_buffering off;
        proxy_request_buffering off;
    }
